name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and offline workflow
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run indicator parity self-test
        run: python -m precision_tap selftest

      - name: Run scanner workflow tests
        run: python -m pytest tests/test_scanner_backtest.py -k scanner -q

      - name: Run backtest workflow tests
        run: python -m pytest tests/test_scanner_backtest.py -k 'backtest or fill_and_stop' -q

      - name: Run full test suite
        run: python -m pytest -q

      - name: Exercise the complete offline workflow
        run: python -m precision_tap demo --no-charts

      # The live path (provider → intraday rebuild → scanner → Telegram) with a
      # fake chart API and a mock Bot API.  Exits non-zero unless every alert
      # the cycle found was actually delivered.
      - name: Live pipeline drill (offline, both providers)
        run: |
          python tools/live_drill.py --provider yahoo --cycles 2
          python tools/live_drill.py --provider yfinance --cycles 2
          python tools/live_drill.py --mode eod --quiet

      - name: Upload scanner/backtest reports
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: precision-tap-demo-reports
          path: |
            results_demo/
            data/csv_demo/
          if-no-files-found: ignore
