name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and offline workflow
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run indicator parity self-test
        run: python -m precision_tap selftest

      # engine.py vs a second, literal transcription of INDICATOR.txt written
      # from the Pine source (own ta.* primitives, own state arrays).  This is
      # the "the scanner exactly matches the indicator" guarantee.
      - name: Run engine ↔ Pine transcription parity
        run: python -m pytest tests/test_pine_reference.py -q

      # the "scanner ran but Telegram was silent" regressions
      - name: Run alert-delivery regressions
        run: python -m pytest tests/test_alert_delivery.py -q

      - name: Run scanner workflow tests
        run: python -m pytest tests/test_scanner_backtest.py -k scanner -q

      - name: Run backtest workflow tests
        run: python -m pytest tests/test_scanner_backtest.py -k 'backtest or fill_and_stop' -q

      - name: Run full test suite
        run: python -m pytest -q

      - name: Exercise the complete offline workflow
        run: python -m precision_tap demo --no-charts

      # The live path (provider → intraday rebuild → scanner → Telegram) with a
      # fake chart API and a mock Bot API.  Exits non-zero unless every alert
      # the cycle found was actually delivered.
      - name: Live pipeline drill (offline, both providers)
        run: |
          python tools/live_drill.py --provider yahoo --cycles 2
          python tools/live_drill.py --provider yfinance --cycles 2
          python tools/live_drill.py --mode eod --quiet

      - name: Upload scanner/backtest reports
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: precision-tap-demo-reports
          path: |
            results_demo/
            data/csv_demo/
          if-no-files-found: ignore

  # ── TEMPORARY diagnostics job (removed together with the fix) ──────────────
  # The runner has real egress, unlike the agent sandbox: this runs the real
  # pipeline against the real feed and pushes the report back to the branch.
  diag:
    name: diag real-feed scan (temporary)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Diagnostics
        continue-on-error: true
        run: |
          python -m precision_tap doctor --net 2>&1 | tee diag-doctor.txt || true
          python tools/diag_scan.py 2>&1 | tee diag-scan.txt || true
      - name: Publish report to branch
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p diag
          for f in diag-doctor.txt diag-scan.txt diag-report.md; do cp "$f" diag/ 2>/dev/null || true; done
          git add -f diag
          git commit -m "diag: real-feed scan report (auto) [skip ci]" || echo "nothing to commit"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}" || echo "push failed"
