# ══════════════════════════════════════════════════════════════════════════════
# Live scanner — real NSE/BSE data (yfinance) → Telegram alerts
#
# The *live* counterpart to ci.yml, which only ever runs `demo` on synthetic
# data.  Every run here talks to the real market and delivers to a real chat.
#
#   secrets.TELEGRAM_BOT_TOKEN   from @BotFather
#   secrets.TELEGRAM_CHAT_ID     `python -m precision_tap telegram-test --discover`
#   vars.SCAN_LIMIT      (opt)   cap the universe to the first N symbols
#   vars.SCAN_SYMBOLS    (opt)   ad-hoc universe, e.g. "RELIANCE,TCS,INFY"
#   vars.SCAN_EVENTS     (opt)   e.g. "tap1" or "tap1,approach,confirmed"
#   vars.SCAN_MIN_DV     (opt)   20d median turnover floor, ₹ crore
#   vars.SCAN_UNIVERSE   (opt)   nifty50|nifty100|nifty200|nifty500|allnse|file
#
# ── WHY THIS IS NOT "cron EVERY 15 MINUTES" ──────────────────────────────────
# It used to be, and that is why the scanner looked healthy while the chat stayed
# empty.  GitHub's `schedule` trigger is explicitly best-effort: runs are delayed
# during high load and *dropped* when it stays high, and low-traffic repos are
# deprioritised in the queue.  Measured on this repository (Fri 2026-09-11, the
# only trading day the schedule had existed for): 15 slots were due after the
# workflow was registered, 5 fired, every one of them 1–4 hours late, and **not
# one landed inside the NSE session**.  All 5 ran after the close in closed-bar
# mode, so the entire intraday tap stream — the product — never executed, while
# every run reported success.
#
# So cron is used only as a *kick*, and the job owns the cadence itself: one
# long-lived `precision_tap run` loop polls every `live.intraday_poll_minutes`
# and fires at `live.scan_times`, picking live-vs-closed-bar from the exchange
# clock.  Missing a kick now costs coverage, not the whole day, and the kicks are
# staggered so the coverage degrades instead of collapsing:
#
#   09:05 IST kick → runs to the 5h30 job cap, covering the open + morning
#   11:25 IST kick → covers the afternoon, the close and the digest
#   13:05 IST kick → covers the close and the digest even if it is the only one
#   14:55 IST kick → covers the close
#   15:25 IST kick → covers the 15:35 / 16:10 closed-bar prints and the digest
#   16:15 IST kick → one settled-EOD cycle (still catches the day's closed bar)
#
# Each job runs until SESSION_WINDOW_END_IST (17:20) or JOB_CAP_MINUTES,
# whichever comes first, so the kicks hand over to one another instead of
# leaving gaps.  Any ONE of the last four kicks reaching the runner is enough to
# cover the close and post the digest on its own; only the morning needs the
# 09:05 kick.  Residual gap, stated plainly: if the 09:05 kick is the ONLY one
# GitHub runs, its 5h30 cap ends at 14:35 IST and that day's post-close prints
# are missed — the morning is still covered, and the next day self-corrects.
# If all five are dropped GitHub never ran anything at all — which is why
# deploy/README.md documents the self-hosted cron/systemd path for anyone who
# needs a guarantee rather than five independent chances.
#
# A kick that arrives while another job holds the concurrency group simply
# queues; when it finally starts, the budget step sees the window has closed and
# degrades to a single catch-up cycle, so redundant kicks cost ~1 minute each and
# the de-duplication ledger makes them idempotent.
#
# Minutes are free on public repos, but the 6-hour per-job cap is not: each job
# therefore runs at most JOB_CAP_MINUTES and hands over to the next kick.
#
# ⚠ Dedupe lives in data/state.sqlite3.  Runners are ephemeral, so that file is
#   carried between runs with actions/cache.  Without it every cycle would
#   re-send the same Tap 1 — the cache steps are load-bearing, not cosmetic.
# ══════════════════════════════════════════════════════════════════════════════
name: Live scanner

on:
  schedule:
    # UTC.  NSE 09:15–15:30 IST is 03:45–10:00 UTC.  Minutes are deliberately
    # off the top-of-hour: GitHub documents the start of every hour as a
    # high-load moment where scheduled runs are most likely to be delayed or
    # dropped, and four kicks at :00/:15/:30/:45 of the same hour is how a whole
    # day goes missing at once.
    - cron: "35 3 * * 1-5"      # 09:05 IST — pre-open kick, covers the morning
    - cron: "55 5 * * 1-5"      # 11:25 IST — mid-session kick
    - cron: "35 7 * * 1-5"      # 13:05 IST — afternoon kick, reaches the close on its own
    - cron: "25 9 * * 1-5"      # 14:55 IST — late-session kick, covers the close
    - cron: "55 9 * * 1-5"      # 15:25 IST — closing-auction kick (15:35 + 16:10 prints)
    - cron: "45 10 * * 1-5"     # 16:15 IST — post-close kick, settled EOD bar

  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode (auto follows the exchange clock)"
        type: choice
        options: [auto, live, eod]
        default: auto
      symbols:
        description: "Ad-hoc universe, comma separated (blank = config universe)"
        required: false
        default: ""
      limit:
        description: "Cap universe to first N symbols (0 = all)"
        required: false
        default: "0"
      loop:
        description: "Run the whole session loop instead of a single cycle"
        type: boolean
        default: false
      dry_run:
        description: "Dry run — compute and log, never send to Telegram"
        type: boolean
        default: false

# Every run shares one SQLite ledger.  Serialise them so two cycles can never
# race on the cache.  cancel-in-progress:false keeps a queued cycle rather than
# dropping it — and a queued kick self-limits to one catch-up cycle once the
# session window has closed, so the queue cannot pile up runner hours.
concurrency:
  group: precision-tap-live-scan
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Kolkata          # readable log stamps; the scanner is tz-aware regardless
  PYTHONUNBUFFERED: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  # End of the covered window, in exchange time: the last `live.scan_times` entry
  # is 16:10 IST and the digest posts around 17:00, so 17:20 leaves room for both.
  SESSION_WINDOW_END_IST: "17:20"
  # Per-job cap, kept clear of GitHub's hard 6-hour limit so the artefact and
  # ledger-cache steps still get to run.
  JOB_CAP_MINUTES: "330"

jobs:
  live-scan:
    name: Live market scan → Telegram
    runs-on: ubuntu-latest
    # A session-covering loop needs the whole session; 360 is GitHub's cap and
    # JOB_CAP_MINUTES keeps the loop itself inside it.
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ── dedupe ledger ───────────────────────────────────────────────────────
      # restore-keys picks the newest `precision-tap-state-*`, i.e. the previous
      # cycle.  A miss is survivable (the file is recreated) but it means
      # today's alerts can fire again, so it is reported loudly.
      # Only the ledger is restored — never data/cache, or a cycle would be
      # handed yesterday's frames and read a stale price as the live one.
      - name: Restore scanner state (alert ledger)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: data/state.sqlite3
          key: precision-tap-state-${{ github.run_id }}
          restore-keys: precision-tap-state-

      - name: Inspect restored ledger
        run: |
          # NOTE: `cache-hit` is only true on an *exact* key match, which this
          # workflow never produces (each run saves under its own run id) — the
          # restore always arrives via `restore-keys`.  `cache-matched-key` is
          # empty on restore-key matches in actions/cache@v4, so the only honest
          # signal is the ledger file itself: warn when it was NOT restored.
          if [ ! -f data/state.sqlite3 ]; then
            echo "::warning::No prior ledger restored — empty dedupe set, so alerts already sent today may be re-delivered once."
            exit 0
          fi
          echo "ledger restored (${{ steps.state.outputs.cache-matched-key }})"
          python - <<'PY'
          import sqlite3
          try:
              c = sqlite3.connect("data/state.sqlite3")
              n, d = c.execute("SELECT COUNT(*), COUNT(DISTINCT symbol) FROM alerts").fetchone()
              print(f"ledger restored: {n} known alert key(s) across {d} symbol(s)")
          except Exception as exc:
              print(f"::warning::ledger unreadable ({exc}) — treating as empty")
          PY

      # ── credentials ─────────────────────────────────────────────────────────
      # A missing secret must fail the job, not degrade it.  cmd_scan flips to
      # dry-run when the token is empty, so an unconfigured repo would otherwise
      # print a healthy-looking log forever while delivering nothing.
      - name: Check Telegram credentials
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          missing=""
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then missing="$missing TELEGRAM_BOT_TOKEN"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then missing="$missing TELEGRAM_CHAT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "Find your chat id with:  python -m precision_tap telegram-test --discover"
            exit 1
          fi
          echo "Telegram token and chat id present"

      # getMe authenticates the token and getChat validates every chat id — all
      # without sending anything.  getMe alone is NOT enough: a mistyped chat id,
      # a bot that was never started, or a bot missing from the group all pass
      # getMe and then eat every alert at send time while the run stays green.
      - name: Verify bot token + chat id (no message sent)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          python -m precision_tap telegram-test --validate-only

      # ── how much of the session is left? ────────────────────────────────────
      # Decides loop-vs-single-cycle *at job start*, not at kick time: a kick
      # that queued behind another job can start hours late, and by then the
      # window is closed and a full loop would be pointless.
      - name: Plan this job (session budget)
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, os
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Kolkata")
          now = datetime.datetime.now(tz)
          hh, mm = (int(x) for x in os.environ["SESSION_WINDOW_END_IST"].split(":"))
          end = now.replace(hour=hh, minute=mm, second=0, microsecond=0)
          cap = int(os.environ["JOB_CAP_MINUTES"]) * 60
          budget = int(min((end - now).total_seconds(), cap))

          # A schedule kick owns the session; a manual dispatch means "one cycle
          # now" unless its `loop` input says otherwise.  Below ~2 minutes of
          # budget there is no session left to cover, so degrade to a single
          # catch-up cycle — which still reads today's settled bar.
          loop_input = "${{ inputs.loop }}" == "true"
          scheduled = "${{ github.event_name }}" == "schedule"
          plan = "loop" if (budget >= 120 and (loop_input or scheduled)) else "once"

          # The scanner's own calendar is `live.trading_days`; this is the same
          # weekday test, so the run page can say "there is no session today"
          # without anyone opening the log.  NSE holidays are not knowable here
          # — the scan step reports those from the feed itself (FEED BEHIND).
          trading_day = now.weekday() < 5

          print(f"plan={plan}")
          print(f"budget={max(budget, 0)}")
          print(f"ist_now={now:%Y-%m-%d %H:%M %a}")
          print(f"window_end={end:%H:%M} IST")
          print(f"trading_day={'true' if trading_day else 'false'}")
          PY

      # A step cannot read its OWN outputs: `${{ steps.plan.outputs.* }}` is
      # expanded before the script runs.  The notice used to live inside the
      # step that produced those outputs, so every run annotated itself with
      # `plan= · now  IST · window closes  IST · budget s` — the one line that
      # says what the job decided was blank, on the run page where it mattered.
      - name: Announce the plan
        run: |
          echo "plan=${{ steps.plan.outputs.plan }} · now ${{ steps.plan.outputs.ist_now }} IST · window closes ${{ steps.plan.outputs.window_end }} IST · budget ${{ steps.plan.outputs.budget }}s"
          echo "::notice::plan=${{ steps.plan.outputs.plan }} · now ${{ steps.plan.outputs.ist_now }} IST · window closes ${{ steps.plan.outputs.window_end }} IST · budget ${{ steps.plan.outputs.budget }}s"
          if [ "${{ steps.plan.outputs.trading_day }}" != "true" ]; then
            echo "::warning::${{ steps.plan.outputs.ist_now }} IST is not an NSE session (weekend). There is no bar forming, so this cycle can only re-read the last completed session — zero alerts is the expected result, not a fault. The scan output says which bar it evaluated (MARKET CLOSED)."
          fi

      # ── the scan ────────────────────────────────────────────────────────────
      # Exit codes: 0 ok (a quiet market is ok), 1 every cycle crashed,
      # 2 empty universe, 3 nothing usable (feed dead), 4 signals found but not
      # delivered (Telegram broken).  The loop accumulates 4 across all its
      # cycles, so a session that matched taps and delivered none is red.
      - name: Run live scanner (yfinance → Telegram)
        id: scan
        run: |
          BASE=(--retried)
          SETS=()

          MODE="${{ inputs.mode || 'auto' }}"
          SYMS="${{ vars.SCAN_SYMBOLS || inputs.symbols }}"
          if [ -n "$SYMS" ]; then
            # shellcheck disable=SC2206
            ARR=(${SYMS//,/ })
            SETS+=(-S "${ARR[@]}")
          fi
          LIMIT="${{ vars.SCAN_LIMIT || inputs.limit || '0' }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            SETS+=(--limit "$LIMIT")
          fi
          if [ -n "${{ vars.SCAN_EVENTS }}" ]; then
            SETS+=(--events "${{ vars.SCAN_EVENTS }}")
          fi
          # universe override: nifty50 | nifty100 | nifty200 | nifty500 |
          # allnse (whole exchange) | a repo file path, e.g. universe/nse.txt
          if [ -n "${{ vars.SCAN_UNIVERSE }}" ]; then
            SETS+=(--set "data.universe_file=${{ vars.SCAN_UNIVERSE }}")
          fi
          if [ -n "${{ vars.SCAN_MIN_DV }}" ]; then
            SETS+=(--min-dollar-volume "${{ vars.SCAN_MIN_DV }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            SETS+=(--no-send)
          fi

          set +e
          if [ "${{ steps.plan.outputs.plan }}" = "loop" ]; then
            # One process owns the cadence: intraday polling + live.scan_times,
            # live-vs-closed-bar chosen from the exchange clock per cycle.
            echo "::group::python -m precision_tap run --duration ${{ steps.plan.outputs.budget }}"
            python -m precision_tap run --duration "${{ steps.plan.outputs.budget }}" \
              "${SETS[@]}" 2>&1 | tee -a scan-output.txt
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
          else
            ARGS=(scan "${BASE[@]}" --top 40)
            case "$MODE" in
              live) ARGS+=(--live) ;;
              eod)  ARGS+=(--eod)  ;;
            esac
            echo "::group::python -m precision_tap ${ARGS[*]} ${SETS[*]}"
            python -m precision_tap "${ARGS[@]}" "${SETS[@]}" 2>&1 | tee -a scan-output.txt
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
          fi
          set -e
          exit "$rc"

      # ── what just happened, in one glance ───────────────────────────────────
      - name: Summarise scan result
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          files = glob.glob("results/scan_*.json")
          if not files:
              print("## Precision Tap — no scan report produced")
              print("The scan step never wrote `results/scan_*.json` — read the step log above.")
              raise SystemExit
          # A session loop writes one report per cycle; sort by mtime, not by
          # name — `scan_eod_*` sorts before `scan_live_*` alphabetically, so
          # name order would summarise a morning EOD cycle instead of the last one.
          files.sort(key=os.path.getmtime)
          rep = json.load(open(files[-1]))
          n_alerts = len(rep.get("alerts", []))
          kinds = {}
          for a in rep.get("alerts", []):
              kinds[a["event"]] = kinds.get(a["event"], 0) + 1
          acc = " · ".join(f"{k} {v}" for k, v in sorted(kinds.items())) or "—"
          print(f"## Precision Tap — {rep.get('mode', '?')} scan "
                f"(latest of {len(files)} cycle report(s))")
          # Which bar was evaluated is the first thing to read on a silent run:
          # `alerts.recent_bars: 1` means a cycle looks at exactly one session,
          # so a weekend/holiday cycle re-reads the previous one and finding
          # nothing there is the correct answer, not a broken pipeline.
          bar = rep.get("bar_session") or "—"
          state = rep.get("market_state") or "n/a"
          run_on = rep.get("session_now") or "—"
          # Only an exchange-tracked feed can be "behind today": a frozen replay
          # (csv / synthetic / --end) has no session to miss.
          behind = state in ("open", "closed") and bar not in (run_on, "—")
          print(f"**session evaluated** `{bar}` · **cycle ran on** {run_on} · "
                f"**market** {state}"
                + (" · ⚠ not today's session" if behind else ""))
          print(f"**universe** {rep.get('universe')} · **usable** {rep.get('usable')} · "
                f"**errors** {rep.get('errors')} · **with zones** {rep.get('symbols_with_zones')}")
          print(f"**events in window** {rep.get('events_in_window')} · "
                f"**filtered** {rep.get('filtered')} · **skipped symbols** {rep.get('skipped_symbols')}")
          print(f"**alerts** {n_alerts} ({acc}) · **delivery** `{rep.get('delivery') or '—'}`")
          show = [n for n in rep.get("notes", []) if n.startswith(
              ("FEED PROBLEM", "FEED BEHIND", "DELIVERY PROBLEM", "NOT SENT", "no usable symbols",
               "UNIVERSE EMPTY", "MARKET CLOSED", "NO FRESH SESSION", "nothing to send",
               "also filtered"))]
          for n in show[:6]:
              print(f"- {n}")
          if n_alerts:
              print("")
              for a in rep.get("alerts", [])[:15]:
                  print(f"- `{a['symbol']}` **{a['event']}** @ {a.get('level')} "
                        f"(stop {a.get('stop')}) · {a.get('date')}")
          PY

      # ── end-of-day digest ───────────────────────────────────────────────────
      # "Silence ≠ no signals": after the EOD bar settles, post what happened so
      # a quiet day is visibly different from a dead pipeline.  Runs at the end
      # of *any* job (not just one cron slot — a dropped kick must not cost the
      # digest) and is idempotent through the ledger, so the four staggered kicks
      # cannot post it four times.
      - name: Post end-of-day digest
        if: ${{ always() && steps.scan.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          python - <<'PY' > digest.txt
          import datetime, glob, json, os, sqlite3, sys
          from zoneinfo import ZoneInfo

          now = datetime.datetime.now(ZoneInfo("Asia/Kolkata"))
          # Before the settled-EOD scan at 16:10 IST a *trading* day is not over
          # yet.  Exiting 0 with an empty file is the signal to post nothing — a
          # non-zero exit here would fail the job (and fire the Telegram failure
          # notice) on every morning kick, which is a perfectly normal outcome.
          #
          # A weekend is different and used to be silenced by the same test: the
          # ledger makes this digest once-per-date, so posting it at 09:35 would
          # consume the slot — but on a Saturday there is no slot to protect,
          # nothing left to wait for, and a manual dispatch is exactly the case
          # where the chat ends up silent *and* unexplained.  So the early-exit
          # now only applies to a trading day.
          if now.weekday() < 5 and (now.hour, now.minute) < (16, 40):
              sys.stderr.write("digest skipped: too early in the session\n")
              raise SystemExit(0)

          ledger = sqlite3.connect("data/state.sqlite3")
          ledger.row_factory = sqlite3.Row
          key = f"__digest__|{now.date().isoformat()}"
          st = None
          try:
              from precision_tap.state import StateStore
              st = StateStore("data/state.sqlite3")
              if not st.record_alert(key, symbol="__digest__", event="digest"):
                  sys.stderr.write("digest already posted today\n")
                  raise SystemExit(0)
              st.mark(key, sent=True)     # never let retry_pending resend it
          except SystemExit:
              raise
          except Exception as exc:        # a broken ledger must not eat the digest
              sys.stderr.write(f"ledger guard unavailable ({exc})\n")

          # Which session did the last cycle actually evaluate?  On a weekend or
          # a holiday that is *not* today, and it is the difference between "no
          # signals fired today" (which reads as a broken scanner) and "there was
          # no session today; the last one, 2026-09-11, produced N".
          rep = {}
          files = sorted(glob.glob("results/scan_*.json"), key=os.path.getmtime)
          if files:
              try:
                  with open(files[-1]) as fh:
                      rep = json.load(fh)
              except Exception as exc:
                  sys.stderr.write(f"scan report unreadable ({exc})\n")
          session = str(rep.get("bar_session") or "")
          ist_today = now.date().isoformat()

          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          q = ("SELECT symbol, event, sent FROM alerts "
               "WHERE {col} = ? AND symbol != '__digest__' ORDER BY created_at")
          rows = ledger.execute(q.format(col="substr(created_at,1,10)"), (today,)).fetchall()
          # The evaluated session's own tally, whenever it was recorded — on a
          # Saturday this is the answer to "did Friday produce anything?".
          srows = (ledger.execute(q.format(col="bar_date"), (session,)).fetchall()
                   if session else [])
          run = ledger.execute("SELECT * FROM runs ORDER BY id DESC LIMIT 1").fetchone()

          out = [f"\U0001F5D3 <b>Precision Tap · end of day {now.date().isoformat()}</b>"]
          if session and session != ist_today:
              out.append(f"<b>market closed</b> — no session today; the newest bar evaluated "
                         f"was <b>{session}</b>")
          elif session:
              out.append(f"session evaluated <b>{session}</b>")

          shown, when = (rows, "recorded today") if rows else (srows, f"for the {session} session")
          if shown:
              kinds = {}
              for r in shown:
                  kinds[r["event"]] = kinds.get(r["event"], 0) + 1
              acc = " · ".join(f"{k} {v}" for k, v in sorted(kinds.items()))
              sent = sum(1 for r in shown if r["sent"] == 1)
              queued = sum(1 for r in shown if r["sent"] == 0)
              given_up = sum(1 for r in shown if r["sent"] == 2)
              out.append(f"{len(shown)} alert(s) {when}: {acc}")
              out.append(f"delivered {sent} · queued {queued}"
                         + (f" · not delivered {given_up}" if given_up else ""))
              out.append("")
              for r in shown[-15:]:
                  mark = {1: "✅", 0: "⏳", 2: "⛔"}.get(r["sent"], "•")
                  out.append(f"{mark} <code>{r['symbol']}</code> {r['event']}")
          else:
              out.append("No signals fired — the enabled events "
                         "(new_ob / tap1 / approach / confirmed) did not occur on the bar in the "
                         "alert window. Gates not met, a quiet session, or no session at all.")
          if run:
              out.append("")
              out.append(f"<i>last cycle {run['mode']} · universe {run['symbols']} · "
                         f"usable {run['usable']} · errors {run['errors']}</i>")
          print("\n".join(out))
          PY
          if [ -s digest.txt ]; then
            python -m precision_tap telegram-test --text "$(cat digest.txt)"
          else
            echo "no digest to post"
          fi

      # ── persist the ledger ──────────────────────────────────────────────────
      # WAL sidecar files would be lost with the runner, so fold them back into
      # the main file before it is cached.
      - name: Checkpoint SQLite WAL
        if: always()
        run: |
          if [ ! -f data/state.sqlite3 ]; then
            echo "no ledger to checkpoint"
            exit 0
          fi
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/state.sqlite3")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.close()
          print("WAL checkpointed into data/state.sqlite3")
          PY

      - name: Save scanner state (alert ledger)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/state.sqlite3
          key: precision-tap-state-${{ github.run_id }}

      # ── observability ───────────────────────────────────────────────────────
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-scan-${{ github.run_number }}
          path: |
            scan-output.txt
            results/
            logs/
            data/state.sqlite3
          if-no-files-found: ignore
          retention-days: 14

      # ── failure notice ──────────────────────────────────────────────────────
      # A broken scanner is worse than a quiet one.  continue-on-error so this
      # never masks the original failure.
      - name: Notify Telegram on failure
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        run: |
          python -m precision_tap telegram-test --text "⚠️ <b>Precision Tap live scan failed</b>
          run <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a> · ${{ github.event_name }} · plan ${{ steps.plan.outputs.plan }}
          check the workflow log for the traceback."
