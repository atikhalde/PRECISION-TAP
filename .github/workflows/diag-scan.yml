# ⚠ TEMPORARY session-branch diagnostic — not part of the production pipeline.
# Runs one real scan cycle on the GitHub runner (real network to Yahoo/NSE),
# then commits the raw scan report + logs back to this branch so the sandboxed
# agent can read them (log/artifact download APIs are unreachable from there).
# Trigger manually only:
#   gh workflow run diag-scan.yml --ref <branch>
name: Diagnostic scan

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: "extra scan args (e.g. --set data.universe_file=nifty500 --limit 15)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: diag-scan
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Real scan cycle (dry — nothing sent)
        run: |
          set +e
          python -m precision_tap scan --no-send --retried --top 40 -v ${{ inputs.extra_args }} \
            2>&1 | tee scan-output.txt
          echo "scan rc=${PIPESTATUS[0]}"

      - name: Feed + zone probes
        run: |
          python -m precision_tap doctor --net 2>&1 | tee doctor.txt || true
          python -m precision_tap zones --top 20 2>&1 | tee zones.txt || true

      - name: Publish diagnostics back to branch
        run: |
          git config user.name "diag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p diag
          cp scan-output.txt doctor.txt zones.txt diag/ 2>/dev/null || true
          cp results/scan_*.json diag/ 2>/dev/null || true
          git add diag
          git commit -m "diag: scan report (auto) [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
